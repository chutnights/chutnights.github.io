<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHUTNIGHTS</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#05080b;color:#e9f4f8}
body{
  background:
    radial-gradient(circle at 50% 20%, rgba(0,150,190,.16), transparent 35%),
    linear-gradient(180deg,#071017 0%,#030507 75%);
}
.page{min-height:100vh;display:flex;flex-direction:column}
header{
  height:74px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(0,190,240,.28);
  background:rgba(3,8,12,.9);backdrop-filter:blur(8px);
}
.brand{font-weight:900;letter-spacing:4px;font-size:22px;color:#f3f7f8}
.brand span{color:#16bde8}
.status{font-size:11px;letter-spacing:2px;color:#7e9aa5}
main{width:min(1100px,92vw);margin:0 auto;padding:55px 0 70px;flex:1}
.hero{
  position:relative;overflow:hidden;min-height:520px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(0,174,226,.38);
  background:linear-gradient(135deg,rgba(7,22,30,.96),rgba(2,6,9,.98));
  box-shadow:0 0 45px rgba(0,120,170,.10);
}
.hero:before,.hero:after{content:"";position:absolute;pointer-events:none}
.hero:before{inset:18px;border:1px solid rgba(255,117,32,.13)}
.hero:after{width:55%;height:1px;background:linear-gradient(90deg,transparent,#08bde9,transparent);top:22px;left:22.5%}
.logo-wrap{position:relative;width:min(690px,82%);text-align:center}
.logo-wrap img{display:block;width:100%;height:auto;filter:drop-shadow(0 0 18px rgba(0,170,230,.25))}
.tagline{margin:24px 0 0;font-size:12px;letter-spacing:4px;color:#9bb0b8}
.intro{text-align:center;padding:42px 15px 10px}
.intro h1{margin:0;font-size:clamp(25px,4vw,42px);letter-spacing:5px;font-weight:800}
.intro p{max-width:680px;margin:18px auto 0;color:#8da2aa;line-height:1.7}
.placeholder{
  margin-top:35px;padding:28px;text-align:center;
  border:1px dashed rgba(0,190,240,.35);background:rgba(8,18,24,.55);
}
.placeholder strong{display:block;letter-spacing:3px;font-size:13px;color:#17c4ee}
.placeholder small{display:block;margin-top:10px;color:#657b84}
footer{border-top:1px solid rgba(0,190,240,.18);padding:24px 5vw;text-align:center;color:#536a73;font-size:11px;letter-spacing:2px}
@media(max-width:600px){
  header{height:64px;padding:0 4vw}.brand{font-size:17px;letter-spacing:3px}.status{display:none}
  main{padding:25px 0 45px}.hero{min-height:390px}.logo-wrap{width:88%}
  .tagline{font-size:9px;letter-spacing:2px}
}
</style>
</head>
<body>
<div class="page">
<header>
  <div class="brand">CHUT<span>NIGHTS</span></div>
  <div class="status">SITE EM CONSTRUÇÃO</div>
</header>

<main>
  <section class="hero">
    <div class="logo-wrap">
      <img src="chutnights-logo.jpg" alt="CHUTNIGHTS">
      <div class="tagline">GAMES • COLLECTION • REVIEWS</div>
    </div>
  </section>

  <section class="intro">
    <h1>CHUTNIGHTS</h1>
    <p>Um espaço dedicado a videogames, coleção, reviews, histórias, dicas, códigos e segredos.</p>
  </section>

  <section class="placeholder">
    <strong>EM BREVE</strong>
    <small>O conteúdo do CHUTNIGHTS está sendo preparado.</small>
  </section>
</main>

<footer>CHUTNIGHTS • 2026</footer>
</div>
</body>
</html>
